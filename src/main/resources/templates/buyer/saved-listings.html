<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Listings — FarmConnect AI</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="app-bg d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 py-4">
        <div class="container">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <!-- Header -->
            <div class="page-header-card d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                <div>
                    <h2 class="page-title mb-0"><i class="bi bi-heart text-danger"></i> Saved Crop Listings</h2>
                    <p class="page-subtitle">Your bookmarked farmer crop listings for quick reference and ordering.</p>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(savedListings)}" class="farm-card p-5 empty-state">
                <div class="empty-state-icon"><i class="bi bi-bookmark-heart"></i></div>
                <h5 class="empty-state-title">No saved listings yet</h5>
                <p class="empty-state-text">Click the heart icon on any crop listing while browsing to save it here for later.</p>
                <a th:href="@{/buyer/search-crops}" class="btn btn-farm-primary btn-sm px-4">Browse Crop Listings</a>
            </div>

            <div th:unless="${#lists.isEmpty(savedListings)}" class="row g-4">
                <div th:each="s : ${savedListings}" class="col-md-6 col-lg-4">
                    <div class="farm-card p-4 h-100 d-flex flex-column justify-content-between border">
                        <div>
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h5 class="fw-bold text-dark mb-0" th:text="${s.cropListing.cropName}">Tomato</h5>
                                <span class="badge bg-success-subtle text-success border border-success-subtle" th:text="${s.cropListing.qualityGrade}">Grade A</span>
                            </div>
                            <div class="small text-muted mb-3">
                                <div><i class="bi bi-person me-1"></i> <span th:text="${s.cropListing.farmer.name}">Farmer</span></div>
                                <div><i class="bi bi-geo-alt me-1"></i> <span th:text="${s.cropListing.location}">District</span></div>
                                <div><i class="bi bi-box-seam me-1"></i> <span th:text="${s.cropListing.quantity} + ' ' + ${s.cropListing.unit}">500 kg</span></div>
                            </div>
                            <div class="fw-bold text-success fs-5 mb-3" th:text="'₹' + ${s.cropListing.expectedPrice} + '/' + ${s.cropListing.unit}">₹24/kg</div>
                        </div>

                        <div class="d-flex gap-2 pt-3 border-top">
                            <a th:href="@{'/buyer/crops/' + ${s.cropListing.id}}" class="btn btn-farm-primary btn-sm w-75">
                                View &amp; Order
                            </a>
                            <form th:action="@{'/buyer/toggle-save/' + ${s.cropListing.id}}" method="post" class="w-25">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" class="btn btn-light border text-danger btn-sm w-100" title="Remove">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
