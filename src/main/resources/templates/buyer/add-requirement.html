<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Crop Demand — FarmConnect AI</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="app-bg d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="farm-card p-4 p-md-5 bg-white shadow">
                        <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                            <div class="stat-icon-wrapper stat-icon-blue" style="width: 48px; height: 48px;">
                                <i class="bi bi-clipboard-plus fs-4"></i>
                            </div>
                            <div>
                                <h3 class="fw-bold text-dark mb-0">Post Bulk Crop Demand</h3>
                                <p class="text-muted small mb-0">Specify crop requirements to automatically match with registered regional farmers.</p>
                            </div>
                        </div>

                        <div th:replace="~{fragments/alerts :: alerts}"></div>

                        <form th:action="@{/buyer/add-requirement}" th:object="${reqDto}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="cropName" class="form-label">Crop Name <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="cropName" th:field="*{cropName}" placeholder="e.g. Tomato, Potato, Onion, Rice" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="qualityRequirement" class="form-label">Quality Requirement</label>
                                    <select class="form-select" id="qualityRequirement" th:field="*{qualityRequirement}">
                                        <option value="Any">Any Standard Quality</option>
                                        <option value="Grade A">Grade A Only</option>
                                        <option value="Grade B">Grade B Acceptable</option>
                                        <option value="Organic Certified">Organic Certified Only</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label for="requiredQuantity" class="form-label">Quantity Needed <span class="text-danger">*</span></label>
                                    <input type="number" step="0.1" class="form-control" id="requiredQuantity" th:field="*{requiredQuantity}" placeholder="e.g. 500" required>
                                </div>
                                <div class="col-md-2">
                                    <label for="unit" class="form-label">Unit <span class="text-danger">*</span></label>
                                    <select class="form-select" id="unit" th:field="*{unit}">
                                        <option value="kg">kg</option>
                                        <option value="Quintal">Quintal</option>
                                        <option value="Ton">Ton</option>
                                        <option value="Box">Box</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label for="minimumPrice" class="form-label">Min Budget (₹) <span class="text-danger">*</span></label>
                                    <input type="number" step="0.5" class="form-control" id="minimumPrice" th:field="*{minimumPrice}" placeholder="e.g. 20" required>
                                </div>
                                <div class="col-md-3">
                                    <label for="maximumPrice" class="form-label">Max Budget (₹) <span class="text-danger">*</span></label>
                                    <input type="number" step="0.5" class="form-control" id="maximumPrice" th:field="*{maximumPrice}" placeholder="e.g. 25" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="requiredFrom" class="form-label">Required From Date <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control" id="requiredFrom" th:field="*{requiredFrom}" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="requiredUntil" class="form-label">Required Until Date <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control" id="requiredUntil" th:field="*{requiredUntil}" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="location" class="form-label">Delivery Location / City <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="location" th:field="*{location}" placeholder="e.g. Koyambedu" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="district" class="form-label">District</label>
                                    <input type="text" class="form-control" id="district" th:field="*{district}" placeholder="e.g. Chennai">
                                </div>
                                <div class="col-md-4">
                                    <label for="state" class="form-label">State</label>
                                    <input type="text" class="form-control" id="state" th:field="*{state}" placeholder="e.g. Tamil Nadu">
                                </div>
                                <div class="col-12">
                                    <label for="description" class="form-label">Requirement Details / Delivery Notes</label>
                                    <textarea class="form-control" id="description" th:field="*{description}" rows="2" placeholder="e.g. Looking for continuous weekly delivery of Grade A tomatoes. Packaging in 25kg crates."></textarea>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                                <a th:href="@{/buyer/requirements}" class="btn btn-light border">Cancel</a>
                                <button type="submit" class="btn btn-farm-primary px-4 py-2">
                                    <i class="bi bi-check2-circle me-1"></i> Post Demand
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
