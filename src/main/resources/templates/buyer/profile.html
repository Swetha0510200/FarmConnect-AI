<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyer Profile ? FarmConnect AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 py-4">
        <div class="container">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="farm-card p-4 p-md-5 bg-white">
                        <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                            <div class="stat-icon-wrapper stat-icon-blue">
                                <i class="bi bi-building-gear fs-4"></i>
                            </div>
                            <div>
                                <h3 class="fw-bold text-dark mb-0">Buyer Business Profile</h3>
                                <p class="text-muted small mb-0">Manage your organization and delivery location settings.</p>
                            </div>
                        </div>

                        <form th:action="@{/buyer/profile}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold text-dark">Contact Person Name</label>
                                    <input type="text" class="form-control" name="name" th:value="${user.name}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold text-dark">Mobile Number</label>
                                    <input type="tel" class="form-control" name="mobile" th:value="${user.mobile}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold text-dark">Email Address (Login ID)</label>
                                    <input type="email" class="form-control bg-light" th:value="${user.email}" readonly>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold text-dark">Business / Company Name</label>
                                    <input type="text" class="form-control" name="farmOrBusinessName" th:value="${profile != null ? profile.businessName : ''}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold text-dark">Business Type</label>
                                    <input type="text" class="form-control" name="farmSizeOrBusinessType" th:value="${profile != null ? profile.businessType : ''}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold text-dark">Warehouse / Office Address</label>
                                    <input type="text" class="form-control" name="addressOrVillage" th:value="${profile != null ? profile.address : ''}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold text-dark">District</label>
                                    <input type="text" class="form-control" name="district" th:value="${profile != null ? profile.district : ''}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold text-dark">State</label>
                                    <input type="text" class="form-control" name="state" th:value="${profile != null ? profile.state : ''}" required>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end">
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-check-lg me-1"></i> Save Changes
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
