<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications — FarmConnect AI</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="app-bg d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 py-4">
        <div class="container">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <!-- Header -->
            <div class="page-header-card d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                <div>
                    <h2 class="page-title mb-0"><i class="bi bi-bell text-primary"></i> Notifications</h2>
                    <p class="page-subtitle">Real-time alerts for incoming orders, status changes, and matched opportunities.</p>
                </div>
                <div>
                    <form th:action="@{/notifications/read-all}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-check2-all me-1"></i> Mark All as Read
                        </button>
                    </form>
                </div>
            </div>

            <div class="farm-card p-4">
                <div th:if="${#lists.isEmpty(notifications)}" class="empty-state py-5">
                    <div class="empty-state-icon"><i class="bi bi-bell-slash"></i></div>
                    <h5 class="empty-state-title">No notifications yet</h5>
                    <p class="empty-state-text">You will receive notifications here when new orders or buyer matches occur.</p>
                </div>

                <div th:unless="${#lists.isEmpty(notifications)}" class="d-flex flex-column gap-3">
                    <div th:each="n : ${notifications}" th:id="'notif-item-' + ${n.id}" class="notification-card d-flex justify-content-between align-items-center" th:classappend="${!n.read ? 'unread-notification' : 'read-notification'}">
                        <div class="d-flex align-items-start gap-3">
                            <div class="stat-icon-wrapper stat-icon-green flex-shrink-0" style="width: 38px; height: 38px;">
                                <i class="bi bi-info-circle fs-5"></i>
                            </div>
                            <div>
                                <h6 class="fw-bold text-dark mb-1" th:text="${n.title}">Notification Title</h6>
                                <p class="text-muted small mb-1" th:text="${n.message}">Message details</p>
                                <small class="text-muted" th:text="${#temporals.format(n.createdAt, 'dd MMM yyyy, hh:mm a')}">Date</small>
                            </div>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <a th:if="${n.link != null && !n.link.isBlank()}" th:href="@{${n.link}}" class="btn btn-sm btn-farm-outline">View</a>
                            <button th:if="${!n.read}" type="button" class="btn btn-sm btn-light border" th:onclick="'markNotificationRead(' + ${n.id} + ', this)'">
                                <i class="bi bi-check2"></i> Mark Read
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
