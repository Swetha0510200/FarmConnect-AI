<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us ? FarmConnect AI</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="app-bg d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <div class="farm-card p-4 p-md-5 bg-white shadow">
                        <div class="text-center mb-4">
                            <div class="stat-icon-wrapper stat-icon-green mx-auto mb-3" style="width: 48px; height: 48px;">
                                <i class="bi bi-envelope-paper fs-4"></i>
                            </div>
                            <h3 class="fw-bold text-dark mb-1">Get in Touch</h3>
                            <p class="text-muted small">Have questions or feedback about FarmConnect AI?</p>
                        </div>

                        <div class="p-3 bg-light rounded-3 mb-4 small border">
                            <div class="d-flex align-items-center gap-3 mb-2">
                                <i class="bi bi-envelope text-success fs-5"></i>
                                <div><strong>Email:</strong> support@farmconnect.ai</div>
                            </div>
                            <div class="d-flex align-items-center gap-3 mb-2">
                                <i class="bi bi-telephone text-success fs-5"></i>
                                <div><strong>Helpdesk:</strong> 1800-FARM-CONNECT (Toll Free)</div>
                            </div>
                            <div class="d-flex align-items-center gap-3">
                                <i class="bi bi-geo-alt text-success fs-5"></i>
                                <div><strong>Platform:</strong> Smart India Hackathon 2026 (SIH26033)</div>
                            </div>
                        </div>

                        <div class="text-center">
                            <a th:href="@{/}" class="btn btn-farm-primary px-4">
                                <i class="bi bi-arrow-left me-1"></i> Return to Homepage
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
