<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users — FarmConnect AI</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="app-bg d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 py-4">
        <div class="container">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <!-- Header -->
            <div class="page-header-card d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                <div>
                    <a th:href="@{/admin/dashboard}" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left me-1"></i> Admin Dashboard</a>
                    <h2 class="page-title mb-0"><i class="bi bi-people text-success"></i> Platform User Management</h2>
                    <p class="page-subtitle">Activate, deactivate, and monitor registered accounts across roles.</p>
                </div>
            </div>

            <div class="farm-card p-4">
                <div class="table-responsive">
                    <table class="table table-custom">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Mobile</th>
                                <th>Role</th>
                                <th>Registered On</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${users}">
                                <td th:text="${u.id}">1</td>
                                <td class="fw-bold text-dark" th:text="${u.name}">User Name</td>
                                <td th:text="${u.email}">email@example.com</td>
                                <td th:text="${u.mobile}">9876543210</td>
                                <td>
                                    <span th:if="${u.role.name() == 'ROLE_FARMER'}" class="badge bg-success-subtle text-success border border-success-subtle">FARMER</span>
                                    <span th:if="${u.role.name() == 'ROLE_BUYER'}" class="badge bg-primary-subtle text-primary border border-primary-subtle">BUYER</span>
                                    <span th:if="${u.role.name() == 'ROLE_ADMIN'}" class="badge bg-danger-subtle text-danger border border-danger-subtle">ADMIN</span>
                                </td>
                                <td class="small text-muted" th:text="${#temporals.format(u.createdAt, 'dd MMM yyyy')}">01 Sep 2026</td>
                                <td>
                                    <span th:if="${u.accountStatus}" class="badge bg-success">Active</span>
                                    <span th:unless="${u.accountStatus}" class="badge bg-danger">Disabled</span>
                                </td>
                                <td>
                                    <form th:if="${u.role.name() != 'ROLE_ADMIN'}" th:action="@{'/admin/toggle-user/' + ${u.id}}" method="post" class="d-inline">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                        <button type="submit" class="btn btn-sm" th:classappend="${u.accountStatus ? 'btn-outline-danger' : 'btn-outline-success'}">
                                            <span th:text="${u.accountStatus ? 'Deactivate' : 'Activate'}">Toggle</span>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
