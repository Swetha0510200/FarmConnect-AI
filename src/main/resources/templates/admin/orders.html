<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Platform Orders — FarmConnect AI</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="app-bg d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 py-4">
        <div class="container">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <!-- Header -->
            <div class="page-header-card d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                <div>
                    <a th:href="@{/admin/dashboard}" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left me-1"></i> Admin Dashboard</a>
                    <h2 class="page-title mb-0"><i class="bi bi-receipt text-primary"></i> All Marketplace Transactions &amp; Orders</h2>
                    <p class="page-subtitle">Real-time log of all trade orders placed between registered buyers and farmers.</p>
                </div>
            </div>

            <div class="farm-card p-4">
                <div class="table-responsive">
                    <table class="table table-custom">
                        <thead>
                            <tr>
                                <th>Order #</th>
                                <th>Date</th>
                                <th>Farmer</th>
                                <th>Buyer</th>
                                <th>Crop &amp; Quantity</th>
                                <th>Total Amount</th>
                                <th>Order Status</th>
                                <th>Payment</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="o : ${orders}">
                                <td class="fw-bold text-dark" th:text="${o.orderNumber}">FC-2026-001</td>
                                <td class="small text-muted" th:text="${#temporals.format(o.orderDate, 'dd MMM yyyy')}">01 Sep 2026</td>
                                <td th:text="${o.farmer.name}">Farmer</td>
                                <td th:text="${o.buyer.name}">Buyer</td>
                                <td th:text="${o.cropName} + ' (' + ${o.quantity} + ' ' + ${o.unit} + ')'">Tomato</td>
                                <td class="fw-bold text-success" th:text="'₹' + ${o.totalAmount}">₹12,000</td>
                                <td>
                                    <span class="badge bg-primary-subtle text-primary border border-primary-subtle" th:text="${o.status.name().replace('_', ' ')}">PLACED</span>
                                </td>
                                <td>
                                    <span th:if="${o.paymentRecord != null && o.paymentRecord.paymentStatus.name() == 'RECEIVED'}" class="badge bg-success">Received</span>
                                    <span th:unless="${o.paymentRecord != null && o.paymentRecord.paymentStatus.name() == 'RECEIVED'}" class="badge bg-warning text-dark">Pending</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
