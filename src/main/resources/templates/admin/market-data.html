<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandi Market Records ? FarmConnect AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 py-4">
        <div class="container">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <a th:href="@{/admin/dashboard}" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left me-1"></i> Admin Dashboard</a>
                    <h3 class="fw-bold text-dark mb-0">Market Price Data Records</h3>
                </div>
            </div>

            <div class="farm-card p-4 bg-white">
                <div class="table-responsive">
                    <table class="table table-custom table-hover">
                        <thead>
                            <tr>
                                <th>Crop</th>
                                <th>Mandi / APMC Name</th>
                                <th>District</th>
                                <th>State</th>
                                <th>Modal Rate</th>
                                <th>Date</th>
                                <th>Source</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(marketPrices)}">
                                <td colspan="7" class="text-center text-muted small py-4">No market price records currently stored in MySQL.</td>
                            </tr>
                            <tr th:each="mp : ${marketPrices}">
                                <td class="fw-bold text-dark" th:text="${mp.cropName}">Tomato</td>
                                <td th:text="${mp.marketName}">Koyambedu APMC</td>
                                <td th:text="${mp.district}">Chennai</td>
                                <td th:text="${mp.state}">Tamil Nadu</td>
                                <td class="fw-bold text-success" th:text="'?' + ${mp.price} + '/' + ${mp.unit}">?23/kg</td>
                                <td class="small text-muted" th:text="${#temporals.format(mp.date, 'dd MMM yyyy')}">01 Sep 2026</td>
                                <td class="small text-muted" th:text="${mp.source}">Agmarknet</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
