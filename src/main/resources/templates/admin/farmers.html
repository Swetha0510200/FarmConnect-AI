<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Farmers ? FarmConnect AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 py-4">
        <div class="container">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <a th:href="@{/admin/dashboard}" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left me-1"></i> Admin Dashboard</a>
                    <h3 class="fw-bold text-dark mb-0">Registered Farmers &amp; FPOs</h3>
                </div>
            </div>

            <div class="farm-card p-4 bg-white">
                <div th:if="${#lists.isEmpty(farmers)}" class="empty-state py-4">
                    <p class="text-muted small">No farmers registered yet.</p>
                </div>

                <div th:unless="${#lists.isEmpty(farmers)}" class="table-responsive">
                    <table class="table table-custom table-hover">
                        <thead>
                            <tr>
                                <th>Farmer Name</th>
                                <th>Farm / FPO Name</th>
                                <th>Farm Size</th>
                                <th>Farming Type</th>
                                <th>Location</th>
                                <th>Contact</th>
                                <th>Account Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="f : ${farmers}">
                                <td class="fw-bold text-dark" th:text="${f.name}">Farmer Name</td>
                                <td th:text="${f.farmerProfile != null && f.farmerProfile.farmName != null ? f.farmerProfile.farmName : 'Independent'}">Green Valley</td>
                                <td th:text="${f.farmerProfile != null && f.farmerProfile.farmSize != null ? f.farmerProfile.farmSize + ' Acres' : 'N/A'}">5 Acres</td>
                                <td th:text="${f.farmerProfile != null ? f.farmerProfile.farmingType : 'Traditional'}">Organic</td>
                                <td class="small text-muted" th:text="${f.farmerProfile != null ? f.farmerProfile.getFullLocation() : 'Location'}">District</td>
                                <td class="small">
                                    <div th:text="${f.mobile}">9876543210</div>
                                    <div class="text-muted" th:text="${f.email}">email</div>
                                </td>
                                <td>
                                    <span th:if="${f.accountStatus}" class="badge bg-success">Active</span>
                                    <span th:unless="${f.accountStatus}" class="badge bg-danger">Disabled</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
