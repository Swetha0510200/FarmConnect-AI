<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Crop Harvest — FarmConnect AI</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="app-bg d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="farm-card p-4 p-md-5 bg-white shadow">
                        <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                            <div class="stat-icon-wrapper stat-icon-green" style="width: 48px; height: 48px;">
                                <i class="bi bi-plus-circle fs-4"></i>
                            </div>
                            <div>
                                <h3 class="fw-bold text-dark mb-0">List Crop Harvest</h3>
                                <p class="text-muted small mb-0">Publish available crop harvest to match with verified buyers.</p>
                            </div>
                        </div>

                        <div th:replace="~{fragments/alerts :: alerts}"></div>

                        <form th:action="@{/farmer/add-crop}" th:object="${cropDto}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="cropName" class="form-label">Crop Name <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="cropName" th:field="*{cropName}" placeholder="e.g. Tomato, Potato, Onion, Rice" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('cropName')}" th:errors="*{cropName}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="qualityGrade" class="form-label">Quality Grade</label>
                                    <select class="form-select" id="qualityGrade" th:field="*{qualityGrade}">
                                        <option value="Grade A">Grade A (Premium Sorted)</option>
                                        <option value="Grade B">Grade B (Standard Commercial)</option>
                                        <option value="Organic Certified">Organic Certified</option>
                                        <option value="Fair Average Quality">Fair Average Quality (FAQ)</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label for="quantity" class="form-label">Quantity Available <span class="text-danger">*</span></label>
                                    <input type="number" step="0.1" class="form-control" id="quantity" th:field="*{quantity}" placeholder="e.g. 500" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>
                                </div>
                                <div class="col-md-2">
                                    <label for="unit" class="form-label">Unit <span class="text-danger">*</span></label>
                                    <select class="form-select" id="unit" th:field="*{unit}">
                                        <option value="kg">kg</option>
                                        <option value="Quintal">Quintal</option>
                                        <option value="Ton">Ton</option>
                                        <option value="Box">Box</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="expectedPrice" class="form-label">Expected Price (₹) <span class="text-danger">*</span></label>
                                    <input type="number" step="0.5" class="form-control" id="expectedPrice" th:field="*{expectedPrice}" placeholder="e.g. 24" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('expectedPrice')}" th:errors="*{expectedPrice}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="availableFrom" class="form-label">Available From Date <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control" id="availableFrom" th:field="*{availableFrom}" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('availableFrom')}" th:errors="*{availableFrom}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="availableUntil" class="form-label">Available Until Date <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control" id="availableUntil" th:field="*{availableUntil}" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('availableUntil')}" th:errors="*{availableUntil}"></div>
                                </div>
                                <div class="col-md-4">
                                    <label for="location" class="form-label">Pickup Village / Town <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="location" th:field="*{location}" placeholder="e.g. Poondi" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="district" class="form-label">District</label>
                                    <input type="text" class="form-control" id="district" th:field="*{district}" placeholder="e.g. Tiruvallur">
                                </div>
                                <div class="col-md-4">
                                    <label for="state" class="form-label">State</label>
                                    <input type="text" class="form-control" id="state" th:field="*{state}" placeholder="e.g. Tamil Nadu">
                                </div>
                                <div class="col-12">
                                    <label for="description" class="form-label">Harvest Notes / Details</label>
                                    <textarea class="form-control" id="description" th:field="*{description}" rows="2" placeholder="e.g. Freshly harvested, sorted in 25kg crates. Pickup available directly from farm gate."></textarea>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                                <a th:href="@{/farmer/crops}" class="btn btn-light border">Cancel</a>
                                <button type="submit" class="btn btn-farm-primary px-4 py-2">
                                    <i class="bi bi-check2-circle me-1"></i> Publish Crop Harvest
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
