<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Crop ? FarmConnect AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="farm-card p-4 p-md-5 bg-white">
                        <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                            <div class="stat-icon-wrapper stat-icon-amber">
                                <i class="bi bi-pencil-square fs-4"></i>
                            </div>
                            <div>
                                <h3 class="fw-bold text-dark mb-0">Edit Crop Listing</h3>
                                <p class="text-muted small mb-0">Update your listed quantity, expected price, or availability.</p>
                            </div>
                        </div>

                        <div th:replace="~{fragments/alerts :: alerts}"></div>

                        <form th:action="@{'/farmer/edit-crop/' + ${listingId}}" th:object="${cropDto}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="cropName" class="form-label small fw-semibold text-dark">Crop Name <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="cropName" th:field="*{cropName}" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="qualityGrade" class="form-label small fw-semibold text-dark">Quality / Variety Grade</label>
                                    <select class="form-select" id="qualityGrade" th:field="*{qualityGrade}">
                                        <option value="Grade A">Grade A (Premium)</option>
                                        <option value="Grade B">Grade B (Standard)</option>
                                        <option value="Grade C">Grade C (Processing)</option>
                                        <option value="Organic Certified">Organic Certified</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label for="quantity" class="form-label small fw-semibold text-dark">Quantity Available <span class="text-danger">*</span></label>
                                    <input type="number" step="0.1" class="form-control" id="quantity" th:field="*{quantity}" required>
                                </div>
                                <div class="col-md-2">
                                    <label for="unit" class="form-label small fw-semibold text-dark">Unit <span class="text-danger">*</span></label>
                                    <select class="form-select" id="unit" th:field="*{unit}">
                                        <option value="kg">kg</option>
                                        <option value="Quintal">Quintal</option>
                                        <option value="Ton">Ton</option>
                                        <option value="Box">Box</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="expectedPrice" class="form-label small fw-semibold text-dark">Expected Price (? per unit) <span class="text-danger">*</span></label>
                                    <input type="number" step="0.5" class="form-control" id="expectedPrice" th:field="*{expectedPrice}" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="availableFrom" class="form-label small fw-semibold text-dark">Available From <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control" id="availableFrom" th:field="*{availableFrom}" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="availableUntil" class="form-label small fw-semibold text-dark">Available Until <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control" id="availableUntil" th:field="*{availableUntil}" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="location" class="form-label small fw-semibold text-dark">Location <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="location" th:field="*{location}" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="district" class="form-label small fw-semibold text-dark">District</label>
                                    <input type="text" class="form-control" id="district" th:field="*{district}">
                                </div>
                                <div class="col-md-4">
                                    <label for="state" class="form-label small fw-semibold text-dark">State</label>
                                    <input type="text" class="form-control" id="state" th:field="*{state}">
                                </div>
                                <div class="col-12">
                                    <label for="description" class="form-label small fw-semibold text-dark">Notes</label>
                                    <textarea class="form-control" id="description" th:field="*{description}" rows="2"></textarea>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                                <a th:href="@{/farmer/crops}" class="btn btn-light border">Cancel</a>
                                <button type="submit" class="btn btn-farm-primary px-4">
                                    <i class="bi bi-check-lg me-1"></i> Update Listing
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
