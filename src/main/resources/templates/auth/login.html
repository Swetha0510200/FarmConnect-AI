<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login ? FarmConnect AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="farm-card p-4 p-md-5 bg-white">
                        <div class="text-center mb-4">
                            <h3 class="fw-bold text-dark mb-1">Welcome Back</h3>
                            <p class="text-muted small">Sign in to your FarmConnect AI account</p>
                        </div>

                        <div th:replace="~{fragments/alerts :: alerts}"></div>

                        <form th:action="@{/auth/login-process}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold text-dark small">Email or Mobile Number</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-person text-muted"></i></span>
                                    <input type="text" class="form-control" id="username" name="username" placeholder="e.g. farmer@example.com or 9876543210" required autofocus>
                                </div>
                            </div>

                            <div class="mb-3">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <label for="password" class="form-label fw-semibold text-dark small mb-0">Password</label>
                                    <a th:href="@{/auth/forgot-password}" class="text-decoration-none small text-success">Forgot Password?</a>
                                </div>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-lock text-muted"></i></span>
                                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                                </div>
                            </div>

                            <div class="d-grid mb-4">
                                <button type="submit" class="btn btn-farm-primary py-2 fw-semibold">
                                    <i class="bi bi-box-arrow-in-right me-2"></i> Login to Account
                                </button>
                            </div>

                            <div class="text-center border-top pt-3">
                                <p class="text-muted small mb-2">New to FarmConnect AI?</p>
                                <div class="d-flex justify-content-center gap-2">
                                    <a th:href="@{/auth/register-farmer}" class="btn btn-outline-success btn-sm fw-semibold">
                                        <i class="bi bi-person-badge me-1"></i> Register as Farmer
                                    </a>
                                    <a th:href="@{/auth/register-buyer}" class="btn btn-outline-primary btn-sm fw-semibold">
                                        <i class="bi bi-building me-1"></i> Register as Buyer
                                    </a>
                                </div>
                            </div>
                        </form>
                    </div>

                    <div class="alert alert-light border mt-3 p-3 small text-muted text-center">
                        <i class="bi bi-shield-lock text-primary me-1"></i>
                        <strong>Default Admin Access:</strong> admin@farmconnect.ai / Admin@FarmConnect2026
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
