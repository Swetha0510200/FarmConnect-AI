<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — FarmConnect AI</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="app-bg d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="farm-card p-4 p-md-5 bg-white shadow">
                        <div class="text-center mb-4">
                            <div class="stat-icon-wrapper stat-icon-amber mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.4rem;">
                                <i class="bi bi-key"></i>
                            </div>
                            <h4 class="fw-bold text-dark mb-1">Reset Your Password</h4>
                            <p class="text-muted small">Enter your registered email address to receive reset instructions.</p>
                        </div>

                        <div th:replace="~{fragments/alerts :: alerts}"></div>

                        <form th:action="@{/auth/forgot-password}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <div class="mb-3">
                                <label for="email" class="form-label">Registered Email Address</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="e.g. yourname@example.com" required>
                            </div>

                            <button type="submit" class="btn btn-farm-primary w-100 py-2 mb-3">
                                Send Password Reset Link
                            </button>
                        </form>

                        <div class="text-center pt-3 border-top small">
                            <a th:href="@{/auth/login}" class="text-muted text-decoration-none">
                                <i class="bi bi-arrow-left me-1"></i> Back to Sign In
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
