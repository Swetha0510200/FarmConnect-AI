<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password ? FarmConnect AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="farm-card p-4 p-md-5 bg-white">
                        <div class="text-center mb-4">
                            <h4 class="fw-bold text-dark mb-1">Reset Your Password</h4>
                            <p class="text-muted small">Enter your registered email address or mobile number to receive password recovery instructions.</p>
                        </div>

                        <div th:replace="~{fragments/alerts :: alerts}"></div>

                        <form th:action="@{/auth/forgot-password}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <div class="mb-3">
                                <label for="identifier" class="form-label fw-semibold text-dark small">Email or Mobile Number</label>
                                <input type="text" class="form-control" id="identifier" name="identifier" placeholder="e.g. farmer@example.com or 9876543210" required autofocus>
                            </div>

                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-farm-primary py-2 fw-semibold">
                                    <i class="bi bi-envelope-paper me-2"></i> Send Reset Instructions
                                </button>
                            </div>

                            <div class="text-center">
                                <a th:href="@{/auth/login}" class="text-decoration-none small text-success">
                                    <i class="bi bi-arrow-left me-1"></i> Back to Login
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
