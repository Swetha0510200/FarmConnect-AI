<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyer Registration ? FarmConnect AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="farm-card p-4 p-md-5 bg-white">
                        <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                            <div class="stat-icon-wrapper stat-icon-blue">
                                <i class="bi bi-building fs-4"></i>
                            </div>
                            <div>
                                <h3 class="fw-bold text-dark mb-0">Buyer Business Registration</h3>
                                <p class="text-muted small mb-0">Register your business to source fresh crops directly from local farmers and FPOs.</p>
                            </div>
                        </div>

                        <div th:replace="~{fragments/alerts :: alerts}"></div>

                        <form th:action="@{/auth/register-buyer}" th:object="${buyerDto}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <h6 class="fw-bold text-primary mb-3"><i class="bi bi-briefcase me-2"></i> Business &amp; Contact Information</h6>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="businessName" class="form-label small fw-semibold text-dark">Business / Company Name <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="businessName" th:field="*{businessName}" placeholder="e.g. FreshHarvest Wholesale" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('businessName')}" th:errors="*{businessName}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="businessType" class="form-label small fw-semibold text-dark">Business Type <span class="text-danger">*</span></label>
                                    <select class="form-select" id="businessType" th:field="*{businessType}" required>
                                        <option value="Wholesaler">Wholesaler / Mandi Trader</option>
                                        <option value="Retailer / Supermarket">Retailer / Supermarket Chain</option>
                                        <option value="Food Processing Unit">Food Processing Unit</option>
                                        <option value="Exporter">Exporter</option>
                                        <option value="Hotel / Restaurant">Hotel / Restaurant Chain</option>
                                        <option value="Individual Bulk Buyer">Individual Bulk Buyer</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="name" class="form-label small fw-semibold text-dark">Contact Person Name <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="e.g. Ananya Sharma" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="mobile" class="form-label small fw-semibold text-dark">Mobile Number <span class="text-danger">*</span></label>
                                    <input type="tel" class="form-control" id="mobile" th:field="*{mobile}" placeholder="e.g. 9876543210" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('mobile')}" th:errors="*{mobile}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="email" class="form-label small fw-semibold text-dark">Email Address <span class="text-danger">*</span></label>
                                    <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="e.g. procurement@freshharvest.com" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="password" class="form-label small fw-semibold text-dark">Password <span class="text-danger">*</span></label>
                                    <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="Create password (min 6 chars)" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                                </div>
                            </div>

                            <h6 class="fw-bold text-primary mb-3"><i class="bi bi-geo-alt me-2"></i> Delivery Location &amp; Warehouse Address</h6>
                            <div class="row g-3 mb-4">
                                <div class="col-12">
                                    <label for="address" class="form-label small fw-semibold text-dark">Facility / Warehouse Address</label>
                                    <input type="text" class="form-control" id="address" th:field="*{address}" placeholder="e.g. Plot 42, Koyambedu Market Complex">
                                </div>
                                <div class="col-md-6">
                                    <label for="district" class="form-label small fw-semibold text-dark">District <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="district" th:field="*{district}" placeholder="e.g. Chennai" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('district')}" th:errors="*{district}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="state" class="form-label small fw-semibold text-dark">State <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="state" th:field="*{state}" placeholder="e.g. Tamil Nadu" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('state')}" th:errors="*{state}"></div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                                <a th:href="@{/auth/login}" class="text-decoration-none text-muted small">
                                    Already registered? <strong class="text-primary">Login</strong>
                                </a>
                                <button type="submit" class="btn btn-primary px-4 py-2 fw-semibold">
                                    <i class="bi bi-building-check me-1"></i> Register as Buyer
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
