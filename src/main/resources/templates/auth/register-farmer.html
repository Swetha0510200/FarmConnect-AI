<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Registration ? FarmConnect AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="farm-card p-4 p-md-5 bg-white">
                        <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                            <div class="stat-icon-wrapper stat-icon-green">
                                <i class="bi bi-person-badge fs-4"></i>
                            </div>
                            <div>
                                <h3 class="fw-bold text-dark mb-0">Farmer Registration</h3>
                                <p class="text-muted small mb-0">Create your free farmer / FPO account to connect directly with verified buyers.</p>
                            </div>
                        </div>

                        <div th:replace="~{fragments/alerts :: alerts}"></div>

                        <form th:action="@{/auth/register-farmer}" th:object="${farmerDto}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <h6 class="fw-bold text-success mb-3"><i class="bi bi-person me-2"></i> Personal &amp; Contact Details</h6>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="name" class="form-label small fw-semibold text-dark">Full Name <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="e.g. Ramesh Kumar" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="mobile" class="form-label small fw-semibold text-dark">Mobile Number (10 digits) <span class="text-danger">*</span></label>
                                    <input type="tel" class="form-control" id="mobile" th:field="*{mobile}" placeholder="e.g. 9876543210" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('mobile')}" th:errors="*{mobile}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="email" class="form-label small fw-semibold text-dark">Email Address <span class="text-danger">*</span></label>
                                    <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="e.g. ramesh@farmmail.com" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="password" class="form-label small fw-semibold text-dark">Password (min 6 chars) <span class="text-danger">*</span></label>
                                    <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="Create a secure password" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                                </div>
                            </div>

                            <h6 class="fw-bold text-success mb-3"><i class="bi bi-geo-alt me-2"></i> Farm Location &amp; Details</h6>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="farmName" class="form-label small fw-semibold text-dark">Farm or FPO Name (Optional)</label>
                                    <input type="text" class="form-control" id="farmName" th:field="*{farmName}" placeholder="e.g. Green Valley Farm">
                                </div>
                                <div class="col-md-6">
                                    <label for="farmSize" class="form-label small fw-semibold text-dark">Farm Size (Acres)</label>
                                    <input type="number" step="0.5" class="form-control" id="farmSize" th:field="*{farmSize}" placeholder="e.g. 5.0">
                                </div>
                                <div class="col-md-4">
                                    <label for="village" class="form-label small fw-semibold text-dark">Village / Town <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="village" th:field="*{village}" placeholder="e.g. Tiruttani Village" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('village')}" th:errors="*{village}"></div>
                                </div>
                                <div class="col-md-4">
                                    <label for="district" class="form-label small fw-semibold text-dark">District <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="district" th:field="*{district}" placeholder="e.g. Tiruvallur" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('district')}" th:errors="*{district}"></div>
                                </div>
                                <div class="col-md-4">
                                    <label for="state" class="form-label small fw-semibold text-dark">State <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="state" th:field="*{state}" placeholder="e.g. Tamil Nadu" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('state')}" th:errors="*{state}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="farmingType" class="form-label small fw-semibold text-dark">Farming Method</label>
                                    <select class="form-select" id="farmingType" th:field="*{farmingType}">
                                        <option value="Traditional">Traditional</option>
                                        <option value="Organic Certified">Organic Certified</option>
                                        <option value="Natural Farming">Natural Farming</option>
                                        <option value="Polyhouse / Hydroponic">Polyhouse / Hydroponic</option>
                                    </select>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                                <a th:href="@{/auth/login}" class="text-decoration-none text-muted small">
                                    Already have an account? <strong class="text-success">Login</strong>
                                </a>
                                <button type="submit" class="btn btn-farm-primary px-4 py-2">
                                    <i class="bi bi-check2-circle me-1"></i> Register as Farmer
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
