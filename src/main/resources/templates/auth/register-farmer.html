<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Registration — FarmConnect AI</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="app-bg d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="farm-card p-4 p-md-5 bg-white shadow">
                        <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                            <div class="stat-icon-wrapper stat-icon-green" style="width: 48px; height: 48px;">
                                <i class="bi bi-flower1 fs-4"></i>
                            </div>
                            <div>
                                <h3 class="fw-bold text-dark mb-0">Farmer / FPO Registration</h3>
                                <p class="text-muted small mb-0">Connect directly with buyers and receive fair crop prices.</p>
                            </div>
                        </div>

                        <div th:replace="~{fragments/alerts :: alerts}"></div>

                        <form th:action="@{/auth/register-farmer}" th:object="${farmerDto}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="name" class="form-label">Full Name <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="e.g. Ramesh Kumar" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="mobile" class="form-label">Mobile Number (10 digits) <span class="text-danger">*</span></label>
                                    <input type="tel" class="form-control" id="mobile" th:field="*{mobile}" placeholder="e.g. 9876543210" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('mobile')}" th:errors="*{mobile}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                                    <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="e.g. ramesh@farm.com" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                                    <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="Min 6 characters" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="farmName" class="form-label">Farm or FPO Group Name</label>
                                    <input type="text" class="form-control" id="farmName" th:field="*{farmName}" placeholder="e.g. Green Valley Farm">
                                </div>
                                <div class="col-md-6">
                                    <label for="farmSize" class="form-label">Farm Land Size (Acres)</label>
                                    <input type="number" step="0.5" class="form-control" id="farmSize" th:field="*{farmSize}" placeholder="e.g. 5">
                                </div>
                                <div class="col-md-4">
                                    <label for="village" class="form-label">Village / Town <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="village" th:field="*{village}" placeholder="e.g. Poondi" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="district" class="form-label">District <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="district" th:field="*{district}" placeholder="e.g. Tiruvallur" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="state" class="form-label">State <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="state" th:field="*{state}" placeholder="e.g. Tamil Nadu" required>
                                </div>
                                <div class="col-12">
                                    <label for="farmingType" class="form-label">Farming Practice</label>
                                    <select class="form-select" id="farmingType" th:field="*{farmingType}">
                                        <option value="Traditional">Traditional Conventional Farming</option>
                                        <option value="Organic Certified">Organic Certified Farming</option>
                                        <option value="Natural / Zero Budget">Natural / Zero Budget Farming</option>
                                        <option value="Hydroponic / Greenhouse">Hydroponic / Greenhouse Protected</option>
                                    </select>
                                </div>
                            </div>

                            <div class="disclaimer-box mb-4">
                                <i class="bi bi-shield-check text-success me-1"></i>
                                <strong>Direct P2P Marketplace:</strong> You deal directly with buyers. Payments are paid directly to you (Cash, UPI, Bank Transfer) with zero platform commission deductions.
                            </div>

                            <button type="submit" class="btn btn-farm-primary w-100 py-2 fs-6">
                                <i class="bi bi-check2-circle me-1"></i> Create Farmer Account
                            </button>
                        </form>

                        <div class="text-center pt-3 border-top mt-4 small text-muted">
                            Already registered? <a th:href="@{/auth/login}" class="text-success fw-semibold text-decoration-none">Sign In</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
