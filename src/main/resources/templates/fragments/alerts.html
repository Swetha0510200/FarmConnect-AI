<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="alerts">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show border-0 shadow-sm d-flex align-items-center gap-2 mb-4" role="alert" style="background: #ecfdf5; border-left: 4px solid #10b981 !important; color: #065f46;">
        <i class="bi bi-check-circle-fill fs-5 text-success"></i>
        <div th:text="${successMessage}">Action completed successfully.</div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show border-0 shadow-sm d-flex align-items-center gap-2 mb-4" role="alert" style="background: #fef2f2; border-left: 4px solid #ef4444 !important; color: #991b1b;">
        <i class="bi bi-exclamation-triangle-fill fs-5 text-danger"></i>
        <div th:text="${errorMessage}">An error occurred.</div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${infoMessage}" class="alert alert-info alert-dismissible fade show border-0 shadow-sm d-flex align-items-center gap-2 mb-4" role="alert" style="background: #f0f9ff; border-left: 4px solid #0284c7 !important; color: #075985;">
        <i class="bi bi-info-circle-fill fs-5 text-info"></i>
        <div th:text="${infoMessage}">Information notice.</div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>
</html>
