<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error (500) ? FarmConnect AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 d-flex align-items-center py-5">
        <div class="container text-center">
            <div class="farm-card p-5 bg-white mx-auto" style="max-width: 540px;">
                <div class="empty-state-icon text-danger"><i class="bi bi-exclamation-octagon-fill"></i></div>
                <h2 class="fw-bold text-dark mb-2">Something Went Wrong (500)</h2>
                <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'An unexpected error occurred while processing your request. Please try again.'}">Our servers encountered an unexpected issue.</p>
                <div class="d-flex justify-content-center gap-2">
                    <a th:href="@{/}" class="btn btn-farm-primary px-4">Return Home</a>
                    <button onclick="history.back()" class="btn btn-outline-secondary px-4">Go Back</button>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
