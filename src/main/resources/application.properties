# ===================================================================
# FarmConnect AI - Application Configuration (SIH26033)
# ===================================================================

spring.application.name=farmconnect-ai

# -------------------------------------------------------------------
# Server Configuration
# -------------------------------------------------------------------
# Render provides PORT automatically.
# Locally it will use 8080.
server.port=${PORT:8080}
server.address=0.0.0.0

# -------------------------------------------------------------------
# Database Configuration - MySQL 8
# -------------------------------------------------------------------
# Local:
# jdbc:mysql://localhost:3306/farmconnect_db
#
# Render:
# Set DB_URL in Render Environment Variables to your FreeDB JDBC URL.

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/farmconnect_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}

spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# Hikari Connection Pool
# -------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# -------------------------------------------------------------------
# JPA & Hibernate
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# Explicit MySQL dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------------------
# Thymeleaf
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# -------------------------------------------------------------------
# Market Data API
# -------------------------------------------------------------------
farmconnect.market.api.url=${MARKET_API_URL:https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070}

farmconnect.market.api.key=${MARKET_API_KEY:}

farmconnect.market.api.timeout-ms=4000

# -------------------------------------------------------------------
# Initial Admin Configuration
# -------------------------------------------------------------------
farmconnect.admin.initial.create=${CREATE_INITIAL_ADMIN:true}

farmconnect.admin.initial.name=${INITIAL_ADMIN_NAME:System Administrator}

farmconnect.admin.initial.email=${INITIAL_ADMIN_EMAIL:admin@farmconnect.ai}

farmconnect.admin.initial.mobile=${INITIAL_ADMIN_MOBILE:9876543210}

farmconnect.admin.initial.password=${INITIAL_ADMIN_PASSWORD:Admin@FarmConnect2026}

# -------------------------------------------------------------------
# File Upload Settings
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
logging.level.com.farmconnect=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
