# ===================================================================
# FarmConnect AI - Application Configuration (SIH26033)
# ===================================================================

spring.application.name=farmconnect-ai
server.port=8080

# -------------------------------------------------------------------
# Database Configuration - FreeDB / Render
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=10000&socketTimeout=30000
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true


# -------------------------------------------------------------------
# Thymeleaf Template Engine
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# -------------------------------------------------------------------
# External APIs & Integrations (Market Data & Geolocation)
# -------------------------------------------------------------------
# Configurable Agmarknet / Government Open Market Price API endpoint
farmconnect.market.api.url=${MARKET_API_URL:https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070}
farmconnect.market.api.key=${MARKET_API_KEY:}
farmconnect.market.api.timeout-ms=4000

# Initial Admin Configuration (Secure Setup)
farmconnect.admin.initial.create=${CREATE_INITIAL_ADMIN:true}
farmconnect.admin.initial.name=${INITIAL_ADMIN_NAME:System Administrator}
farmconnect.admin.initial.email=${INITIAL_ADMIN_EMAIL:admin@farmconnect.ai}
farmconnect.admin.initial.mobile=${INITIAL_ADMIN_MOBILE:9876543210}
farmconnect.admin.initial.password=${INITIAL_ADMIN_PASSWORD:Admin@FarmConnect2026}

# File Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.com.farmconnect=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO