<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order — FarmConnect AI</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="app-bg d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 py-4">
        <div class="container">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="farm-card p-4 p-md-5 bg-white shadow">
                        <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                            <div class="stat-icon-wrapper stat-icon-green" style="width: 48px; height: 48px;">
                                <i class="bi bi-cart-plus fs-4"></i>
                            </div>
                            <div>
                                <h3 class="fw-bold text-dark mb-0">Place Order with Farmer</h3>
                                <p class="text-muted small mb-0">Confirm order quantity and agreed purchase price.</p>
                            </div>
                        </div>

                        <!-- Listing Summary Box -->
                        <div class="p-3 bg-light rounded-3 mb-4 small border">
                            <div class="row g-2">
                                <div class="col-md-6"><strong>Crop:</strong> <span th:text="${listing.cropName}">Tomato</span> (<span th:text="${listing.qualityGrade}">Grade A</span>)</div>
                                <div class="col-md-6"><strong>Farmer:</strong> <span th:text="${listing.farmer.name}">Farmer Name</span></div>
                                <div class="col-md-6"><strong>Max Available:</strong> <span th:text="${listing.quantity} + ' ' + ${listing.unit}">500 kg</span></div>
                                <div class="col-md-6"><strong>Farmer Price:</strong> <span class="text-success fw-bold" th:text="'₹' + ${listing.expectedPrice} + '/' + ${listing.unit}">₹24/kg</span></div>
                            </div>
                        </div>

                        <form th:action="@{/buyer/place-order}" th:object="${orderDto}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <input type="hidden" th:field="*{cropListingId}" />

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="quantity" class="form-label">Order Quantity (<span th:text="${listing.unit}">kg</span>) <span class="text-danger">*</span></label>
                                    <input type="number" step="0.1" class="form-control" id="quantity" th:field="*{quantity}" oninput="calcTotal()" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="agreedPrice" class="form-label">Agreed Price (₹ per <span th:text="${listing.unit}">kg</span>) <span class="text-danger">*</span></label>
                                    <input type="number" step="0.5" class="form-control" id="agreedPrice" th:field="*{agreedPrice}" oninput="calcTotal()" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('agreedPrice')}" th:errors="*{agreedPrice}"></div>
                                </div>
                                <div class="col-12">
                                    <label for="notes" class="form-label">Special Delivery / Order Notes</label>
                                    <textarea class="form-control" id="notes" th:field="*{notes}" rows="2" placeholder="e.g. Please sort into 25kg crates. Pickup will be arranged tomorrow morning."></textarea>
                                </div>
                            </div>

                            <!-- Calculated Total Display -->
                            <div class="p-3 bg-success-subtle border border-success-subtle rounded-3 mb-4 d-flex justify-content-between align-items-center">
                                <div>
                                    <span class="text-success fw-semibold">Estimated Total Amount:</span>
                                    <div class="small text-muted">Payable directly to farmer upon delivery confirmation.</div>
                                </div>
                                <h3 class="fw-bold text-success mb-0" id="totalDisplay">₹0</h3>
                            </div>

                            <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                                <a th:href="@{'/buyer/crops/' + ${listing.id}}" class="btn btn-light border">Cancel</a>
                                <button type="submit" class="btn btn-farm-primary px-4 py-2">
                                    <i class="bi bi-check2-circle me-1"></i> Confirm &amp; Place Order
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script>
        function calcTotal() {
            const qty = parseFloat(document.getElementById('quantity')?.value) || 0;
            const price = parseFloat(document.getElementById('agreedPrice')?.value) || 0;
            const total = Math.round(qty * price * 100) / 100;
            document.getElementById('totalDisplay').textContent = '₹' + total.toLocaleString('en-IN');
        }
        document.addEventListener('DOMContentLoaded', calcTotal);
    </script>
</body>
</html>
