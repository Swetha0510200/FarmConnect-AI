<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Profile — FarmConnect AI</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="app-bg d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 py-4">
        <div class="container">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="farm-card p-4 p-md-5 bg-white shadow">
                        <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                            <div class="stat-icon-wrapper stat-icon-green" style="width: 48px; height: 48px;">
                                <i class="bi bi-person-gear fs-4"></i>
                            </div>
                            <div>
                                <h3 class="fw-bold text-dark mb-0">Farmer Profile Settings</h3>
                                <p class="text-muted small mb-0">Manage your farm location, contact info, and farming methods.</p>
                            </div>
                        </div>

                        <form th:action="@{/farmer/profile}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label">Full Name <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" name="name" th:value="${user.name}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Mobile Number <span class="text-danger">*</span></label>
                                    <input type="tel" class="form-control" name="mobile" th:value="${user.mobile}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Email Address (Login ID)</label>
                                    <input type="email" class="form-control bg-light" th:value="${user.email}" readonly>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Farm or FPO Name</label>
                                    <input type="text" class="form-control" name="farmOrBusinessName" th:value="${profile != null ? profile.farmName : ''}">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Farm Size (Acres)</label>
                                    <input type="number" step="0.5" class="form-control" name="farmSizeOrBusinessType" th:value="${profile != null ? profile.farmSize : ''}">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Village / Town <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" name="addressOrVillage" th:value="${profile != null ? profile.village : ''}" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">District <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" name="district" th:value="${profile != null ? profile.district : ''}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">State <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" name="state" th:value="${profile != null ? profile.state : ''}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Farming Practice</label>
                                    <select class="form-select" name="farmingType">
                                        <option value="Traditional" th:selected="${profile != null && profile.farmingType == 'Traditional'}">Traditional</option>
                                        <option value="Organic Certified" th:selected="${profile != null && profile.farmingType == 'Organic Certified'}">Organic Certified</option>
                                        <option value="Natural / Zero Budget" th:selected="${profile != null && profile.farmingType == 'Natural / Zero Budget'}">Natural / Zero Budget</option>
                                        <option value="Hydroponic / Greenhouse" th:selected="${profile != null && profile.farmingType == 'Hydroponic / Greenhouse'}">Hydroponic / Greenhouse</option>
                                    </select>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end">
                                <button type="submit" class="btn btn-farm-primary px-4 py-2">
                                    <i class="bi bi-check-lg me-1"></i> Save Profile Changes
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
