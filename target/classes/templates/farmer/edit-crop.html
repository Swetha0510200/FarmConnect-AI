<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Crop Listing — FarmConnect AI</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="app-bg d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="farm-card p-4 p-md-5 bg-white shadow">
                        <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                            <div class="stat-icon-wrapper stat-icon-amber" style="width: 48px; height: 48px;">
                                <i class="bi bi-pencil-square fs-4"></i>
                            </div>
                            <div>
                                <h3 class="fw-bold text-dark mb-0">Edit Crop Listing</h3>
                                <p class="text-muted small mb-0">Update your harvest quantities, price, and availability dates.</p>
                            </div>
                        </div>

                        <div th:replace="~{fragments/alerts :: alerts}"></div>

                        <form th:action="@{'/farmer/edit-crop/' + ${cropId}}" th:object="${cropDto}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label">Crop Name <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{cropName}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Quality Grade</label>
                                    <select class="form-select" th:field="*{qualityGrade}">
                                        <option value="Grade A">Grade A (Premium Sorted)</option>
                                        <option value="Grade B">Grade B (Standard Commercial)</option>
                                        <option value="Organic Certified">Organic Certified</option>
                                        <option value="Fair Average Quality">Fair Average Quality (FAQ)</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Quantity Available <span class="text-danger">*</span></label>
                                    <input type="number" step="0.1" class="form-control" th:field="*{quantity}" required>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Unit <span class="text-danger">*</span></label>
                                    <select class="form-select" th:field="*{unit}">
                                        <option value="kg">kg</option>
                                        <option value="Quintal">Quintal</option>
                                        <option value="Ton">Ton</option>
                                        <option value="Box">Box</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Expected Price (₹) <span class="text-danger">*</span></label>
                                    <input type="number" step="0.5" class="form-control" th:field="*{expectedPrice}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Available From Date <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control" th:field="*{availableFrom}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Available Until Date <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control" th:field="*{availableUntil}" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Pickup Village / Town <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{location}" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">District</label>
                                    <input type="text" class="form-control" th:field="*{district}">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">State</label>
                                    <input type="text" class="form-control" th:field="*{state}">
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Harvest Notes</label>
                                    <textarea class="form-control" th:field="*{description}" rows="2"></textarea>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                                <a th:href="@{/farmer/crops}" class="btn btn-light border">Cancel</a>
                                <button type="submit" class="btn btn-farm-primary px-4 py-2">
                                    <i class="bi bi-check-lg me-1"></i> Save Changes
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
