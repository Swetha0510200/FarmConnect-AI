<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — FarmConnect AI</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="app-bg d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-5">
                    <div class="farm-card p-4 p-md-5 bg-white shadow">
                        <div class="text-center mb-4">
                            <div class="brand-icon-box mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
                                <i class="bi bi-tree"></i>
                            </div>
                            <h3 class="fw-bold text-dark mb-1">Welcome Back</h3>
                            <p class="text-muted small">Sign in to your FarmConnect AI account</p>
                        </div>

                        <!-- Alerts -->
                        <div th:if="${param.error}" class="alert alert-danger py-2 small mb-3 border-0 d-flex align-items-center gap-2" style="background: #fef2f2; color: #991b1b;">
                            <i class="bi bi-exclamation-circle-fill text-danger"></i>
                            <span>Invalid email/mobile or password. Please try again.</span>
                        </div>
                        <div th:if="${param.logout}" class="alert alert-success py-2 small mb-3 border-0 d-flex align-items-center gap-2" style="background: #ecfdf5; color: #065f46;">
                            <i class="bi bi-check-circle-fill text-success"></i>
                            <span>You have been successfully logged out.</span>
                        </div>
                        <div th:if="${param.registered}" class="alert alert-success py-2 small mb-3 border-0 d-flex align-items-center gap-2" style="background: #ecfdf5; color: #065f46;">
                            <i class="bi bi-check-circle-fill text-success"></i>
                            <span>Registration successful! Please sign in with your credentials.</span>
                        </div>

                        <form th:action="@{/auth/login-process}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <div class="mb-3">
                                <label for="username" class="form-label">Email Address or Mobile Number</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                                    <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" placeholder="e.g. farmer@farm.com or 9876543210" required autofocus>
                                </div>
                            </div>

                            <div class="mb-3">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <label for="password" class="form-label mb-0">Password</label>
                                    <a th:href="@{/auth/forgot-password}" class="text-decoration-none small text-success">Forgot Password?</a>
                                </div>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                    <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="••••••••" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-farm-primary w-100 py-2 mb-3">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Account
                            </button>
                        </form>

                        <div class="text-center pt-3 border-top small text-muted">
                            Don't have an account? Register as:
                            <div class="d-flex justify-content-center gap-2 mt-2">
                                <a th:href="@{/auth/register-farmer}" class="btn btn-sm btn-outline-success">Farmer / FPO</a>
                                <a th:href="@{/auth/register-buyer}" class="btn btn-sm btn-outline-primary">Bulk Buyer</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
