<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderate Listings — FarmConnect AI</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="app-bg d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 py-4">
        <div class="container">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <!-- Header -->
            <div class="page-header-card d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                <div>
                    <a th:href="@{/admin/dashboard}" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left me-1"></i> Admin Dashboard</a>
                    <h2 class="page-title mb-0"><i class="bi bi-card-list text-warning"></i> Platform Crop Listings</h2>
                    <p class="page-subtitle">Moderate active, sold, and archived crop harvest listings across all farmers.</p>
                </div>
            </div>

            <div class="farm-card p-4">
                <div class="table-responsive">
                    <table class="table table-custom">
                        <thead>
                            <tr>
                                <th>Crop</th>
                                <th>Farmer</th>
                                <th>Quantity</th>
                                <th>Expected Price</th>
                                <th>Grade</th>
                                <th>Location</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${listings}">
                                <td class="fw-bold text-dark" th:text="${c.cropName}">Tomato</td>
                                <td th:text="${c.farmer.name}">Farmer</td>
                                <td th:text="${c.quantity} + ' ' + ${c.unit}">500 kg</td>
                                <td class="fw-bold text-success" th:text="'₹' + ${c.expectedPrice} + '/' + ${c.unit}">₹24/kg</td>
                                <td th:text="${c.qualityGrade}">Grade A</td>
                                <td class="small text-muted" th:text="${c.location}">Location</td>
                                <td>
                                    <span th:if="${c.status.name() == 'ACTIVE'}" class="badge bg-success">ACTIVE</span>
                                    <span th:if="${c.status.name() == 'COMPLETED'}" class="badge bg-secondary">SOLD</span>
                                    <span th:if="${c.status.name() == 'INACTIVE'}" class="badge bg-warning text-dark">INACTIVE</span>
                                </td>
                                <td>
                                    <form th:action="@{'/farmer/toggle-crop/' + ${c.id}}" method="post" class="d-inline">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                        <button type="submit" class="btn btn-sm btn-outline-warning">Toggle</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
